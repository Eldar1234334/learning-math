name: Math engine tests
# Runs the math engine tests (tests/math.test.js) on every upload, so a broken generator is caught before it reaches the test site.
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the tests
        run: node tests/math.test.js
