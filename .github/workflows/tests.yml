name: Tests
# Runs the math engine, spell book and fight tests (tests/) and the balance simulator (tools/sim.js) on every upload, so a broken generator or spell gate is caught before it reaches the test site.
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the math engine tests
        run: node tests/math.test.js
      - name: Run the spell book tests
        run: node tests/spells.test.js
      - name: Run the fight rules tests
        run: node tests/combat.test.js
      - name: Check the balance goals (fight simulator, spec 03 §1)
        run: node tools/sim.js 60
