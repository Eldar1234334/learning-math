<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Math Wizard tests</title>
<style>
body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#1b1340;color:#fff}
h1{font-size:1.4rem;margin:0 0 4px}
.sum{font-size:1.1rem;margin:8px 0 14px}
.ok{color:#7dffb0}.bad{color:#ff8b99}
li{margin:4px 0}small{display:block;opacity:.85;margin-inline-start:18px}
</style>
</head>
<body>
<h1>🧪 Math engine tests</h1>
<div class="sum" id="sum">Running…</div>
<ul id="list"></ul>
<script src="../math.js"></script>
<script src="../spells.js"></script>
<script src="../combat.js"></script>
<script src="../brew.js"></script>
<script>
const load = src => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; document.body.appendChild(s); });
setTimeout(async () => {
  await load('math.test.js'); await load('spells.test.js'); await load('combat.test.js'); await load('brew.test.js');
  {
    const r = [...(window.MATH_TEST_RESULTS || []), ...(window.SPELL_TEST_RESULTS || []), ...(window.COMBAT_TEST_RESULTS || []), ...(window.BREW_TEST_RESULTS || [])], bad = r.filter(x => !x.ok);
    document.getElementById('sum').innerHTML = bad.length ? `<b class="bad">${bad.length} of ${r.length} tests failed</b>` : `<b class="ok">All ${r.length} tests passed ✔</b>`;
    document.getElementById('list').innerHTML = r.map(x => `<li class="${x.ok ? 'ok' : 'bad'}">${x.ok ? '✔' : '✘'} ${x.name}${x.ok ? '' : `<small>${x.msg.replace(/</g, '&lt;')}</small>`}</li>`).join('');
  }
}, 30);
</script>
</body>
</html>
